<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Does a Bigger Bill Mean a Bigger Tip?</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
  :root { color-scheme: light; }
  body { margin: 0; font-family: Inter, Arial, sans-serif; color: #800200; background: #ffffff; }
  main { max-width: 1050px; margin: 0 auto; padding: 32px 24px 48px; }
  h1 { font-size: clamp(28px, 4vw, 42px); letter-spacing: -0.035em; margin: 0 0 8px; font-weight: 650; }
  .subtitle { color: #800200; margin: 0 0 24px; line-height: 1.5; }
  .controls { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  label { font-size: 13px; color: #0000; display: flex; gap: 8px; align-items: center; }
  select { font: inherit; background: white; border: 1px solid #c9c6be; border-radius: 5px; padding: 7px 10px; }
  #chart-wrap { background: white; border: 1px solid #fffff; border-radius: 10px; padding: 12px; }
  svg { display: block; width: 100%; height: auto; overflow: visible; }
  .grid line { stroke: #ffffff; }
  .grid path { display: none; }
  .axis path, .axis line { stroke: #aaa69d; }
  .axis text { fill: #800200; font-size: 12px; }
  .axis-label { font-size: 13px; fill: #800200; }
  .dot { fill: #800200; fill-opacity: .72; stroke: white; stroke-width: .7; }
  .dot:hover { fill: #FFC0CB; fill-opacity: 1; stroke: #000000; stroke-width: 1.3; }
  #tooltip { position: fixed; display: none; pointer-events: none; z-index: 10; background: #000000; color: white; padding: 10px 12px; border-radius: 6px; font-size: 12px; line-height: 1.55; box-shadow: 0 4px 16px #0002; }
  #status { font-size: 13px; color: #800200; margin: 12px 2px 0; }
  .source { font-size: 12px; color: #800200; line-height: 1.5; margin-top: 18px; }
  a { color: #800200; }
</style>
</head>
<body>
<main>
  <h1>Does a Bigger Bill Mean a Bigger Tip?</h1>
  <p class="subtitle">Each dot represents one restaurant bill. By Khushi Shirur.</p>
  <div class="controls">
    <label>Day
      <select id="day"><option value="All">All days</option></select>
    </label>
    <label>Meal period
      <select id="time"><option value="All">Lunch + dinner</option><option>Lunch</option><option>Dinner</option></select>
    </label>
    <span id="count" aria-live="polite"></span>
  </div>
  <div id="chart-wrap"><svg id="chart" viewBox="0 0 900 560" role="img" aria-label="Scatterplot of restaurant bill amount and tip amount"></svg></div>
  <div id="status">Loading dataset…</div>
  <div id="tooltip"></div>
  <p class="source">Source: <a href="https://github.com/mwaskom/seaborn-data/blob/master/tips.csv">Tips dataset, mwaskom/seaborn-data</a>. 
<script>
const dataURL = "https://raw.githubusercontent.com/mwaskom/seaborn-data/master/tips.csv";
const svg = d3.select("#chart");
const width = 900, height = 560;
const margin = {top: 22, right: 28, bottom: 72, left: 76};
const innerW = width - margin.left - margin.right;
const innerH = height - margin.top - margin.bottom;
const plot = svg.append("g").attr("transform", `translate(${margin.left},${margin.top})`);
const x = d3.scaleLinear().domain([0, 55]).range([0, innerW]);
const y = d3.scaleLinear().domain([0, 11]).range([innerH, 0]);
const xAxis = plot.append("g").attr("class", "axis").attr("transform", `translate(0,${innerH})`);
const yAxis = plot.append("g").attr("class", "axis");
plot.append("g").attr("class", "grid").call(d3.axisLeft(y).ticks(6).tickSize(-innerW).tickFormat(""));
plot.append("g").attr("class", "grid").attr("transform", `translate(0,${innerH})`).call(d3.axisBottom(x).ticks(8).tickSize(-innerH).tickFormat(""));
xAxis.call(d3.axisBottom(x).ticks(8).tickFormat(d => "$" + d));
yAxis.call(d3.axisLeft(y).ticks(6).tickFormat(d => "$" + d));
plot.append("text").attr("class", "axis-label").attr("x", innerW/2).attr("y", innerH + 52).attr("text-anchor", "middle").text("Total bill (US dollars)");
plot.append("text").attr("class", "axis-label").attr("transform", "rotate(-90)").attr("x", -innerH/2).attr("y", -54).attr("text-anchor", "middle").text("Tip (US dollars)");
const dots = plot.append("g").attr("class", "dots");
const tooltip = d3.select("#tooltip");
let data = [];

function update() {
  const day = document.querySelector("#day").value;
  const time = document.querySelector("#time").value;
  const filtered = data.filter(d => (day === "All" || d.day === day) && (time === "All" || d.time === time));
  document.querySelector("#count").textContent = `${filtered.length} of ${data.length} bills`;
  const selection = dots.selectAll("circle").data(filtered, (d, i) => d.row);
  selection.exit().remove();
  selection.enter().append("circle").attr("class", "dot").attr("r", 5)
    .merge(selection)
    .attr("cx", d => x(d.total_bill))
    .attr("cy", d => y(d.tip))
    .on("pointerenter", function(event, d) {
      d3.select(this).raise();
      tooltip.style("display", "block").html(
        `<strong>${d.day} · ${d.time}</strong><br>` +
        `Bill: $${d.total_bill.toFixed(2)}<br>` +
        `Tip: $${d.tip.toFixed(2)} (${(d.tip/d.total_bill*100).toFixed(1)}%)<br>` +
        `Party size: ${d.size}<br>` +
        `Bill payer: ${d.sex}<br>Smoker in party: ${d.smoker}`
      );
    })
    .on("pointermove", function(event) {
      tooltip.style("left", (event.clientX + 14) + "px").style("top", (event.clientY + 14) + "px");
    })
    .on("pointerleave", () => tooltip.style("display", "none"));
}
d3.csv(dataURL, d => ({
  total_bill: +d.total_bill, tip: +d.tip, sex: d.sex, smoker: d.smoker,
  day: d.day, time: d.time, size: +d.size, row: `${d.day}-${d.time}-${d.total_bill}-${d.tip}-${d.size}`
})).then(rows => {
  data = rows;
  const days = ["Thur", "Fri", "Sat", "Sun"];
  d3.select("#day").selectAll("option.day-option").data(days).enter()
    .append("option").attr("class", "day-option").attr("value", d => d)
    .text(d => ({Thur:"Thursday", Fri:"Friday", Sat:"Saturday", Sun:"Sunday"}[d]));
  document.querySelector("#status").textContent = "Loaded successfully. Hover over any point to inspect a bill and its tip.";
  document.querySelector("#day").addEventListener("change", update);
  document.querySelector("#time").addEventListener("change", update);
  update();
}).catch(error => {
  console.error(error);
  document.querySelector("#status").textContent = "The CSV could not be loaded. Check your internet connection or try publishing this page with GitHub Pages.";
});
</script>
</body>
</html>
